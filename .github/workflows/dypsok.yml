# Dypsøk i Evo Lab: finner og beviser den beste evo-planen for kortene som bare har den raske planen,
# de som ender høyest først, og legger siden ut på nytt. Starter av seg selv når «Oppdater siden» er ferdig.
# Fremdriften lagres i cachen, så hver runde fortsetter der forrige slapp. Ingen henting fra nettet her.
name: Dypsøk Evo Lab

on:
  workflow_run:
    workflows: ["Oppdater siden"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  TZ: Europe/Oslo
  PYTHONUTF8: "1"

jobs:
  dypsok:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sett tidsfrist
        run: echo "FC_FRIST=$(( $(date +%s) + 70*60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent data fra forrige kjøring
        uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-dyp-${{ github.run_id }}
          restore-keys: fcdata-

      - name: Rate og søk dypt
        run: |
          files=""
          for f in data/ea_players.json data/spesialkort.json data/mine_spillere.json; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then echo "Ingen kortdata i cachen."; exit 1; fi
          python -m fcrating rate $files --ignorer-brukte --lagre-meta-start --top 5
          python -m fcrating publiser

      - name: Lagre fremdriften
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-dyp-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Legg ut på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
