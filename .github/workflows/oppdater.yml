# Henter nye kort, rater alt og legger siden ut på GitHub Pages.
# Oppsett: se «Legge ut siden for vennene dine» i README.md.
name: Oppdater siden

on:
  schedule:
    # Kveldsrunden skal treffe kl. 19:25 norsk tid, like etter at EA bytter innhold kl. 19:00 (18:00 britisk tid).
    # GitHub bruker UTC, og norsk tid flytter seg to ganger i året, så den står to ganger (17:25 og 18:25 UTC).
    # Steget «Er det kveldsrunden?» under slipper bare gjennom den som faller på kl. 19 norsk tid.
    - cron: "25 17 * * *"
    - cron: "25 18 * * *"
    # Tre runder til i døgnet, ca. 03:25, 09:25 og 15:25 norsk tid (sommertid; én time tidligere om vinteren).
    - cron: "25 1 * * *"
    - cron: "25 7 * * *"
    - cron: "25 13 * * *"
  workflow_dispatch:          # knappen «Run workflow» under Actions: oppdater nå
  push:
    branches: [main]
    paths:
      - "config/**"
      - "fcrating/**"
      - "data/mine_evoer.json"
      - "data/auto_evoer.json"
      - "data/mine_spillere.json"
      - "data/side.json"
      - ".github/workflows/oppdater.yml"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TZ: Europe/Oslo             # klokkeslettet «Oppdatert ...» på sidene vises i norsk tid
  PYTHONUTF8: "1"

jobs:
  kveld:
    name: Er det kveldsrunden?
    runs-on: ubuntu-latest
    outputs:
      kjor: ${{ steps.gate.outputs.kjor }}
    steps:
      - id: gate
        env:
          HENDELSE: ${{ github.event_name }}
          PLAN: ${{ github.event.schedule }}
        run: |
          kjor=ja
          if [ "$HENDELSE" = "schedule" ] && { [ "$PLAN" = "25 17 * * *" ] || [ "$PLAN" = "25 18 * * *" ]; }; then
            time=$(TZ=Europe/Oslo date +%H)
            echo "Norsk klokketime nå: $time"
            if [ "$time" != "19" ]; then kjor=nei; fi
          fi
          echo "kjor=$kjor" >> "$GITHUB_OUTPUT"

  oppdater:
    needs: kveld
    if: needs.kveld.outputs.kjor == 'ja'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # for å lagre data/meta_start.json første gang
      pages: write
      id-token: write
    timeout-minutes: 150      # første kjøring og ukesgjennomgangen av FIFA Rosters tar lengst tid
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tidsfrister regnet fra start, så jobben blir ferdig og legger ut siden innenfor timeout-minutes (150):
      # hentingen stopper etter 55 minutter, og Evo Lab starter ingen nye fulle plansøk etter 105 minutter
      # (kortene som gjenstår får det raske søket nå og det fulle neste kjøring).
      - name: Sett tidsfrister
        run: |
          start=$(date +%s)
          echo "FC_HENT_FRIST=$((start + 55*60))" >> "$GITHUB_ENV"
          echo "FC_FRIST=$((start + 105*60))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent data fra forrige kjøring
        uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-${{ github.run_id }}
          restore-keys: fcdata-

      - name: Hent EA-basekort (FC 27, én gang i uka)
        run: python -m fcrating fetch-ea --hvis-gammel 7
        continue-on-error: true     # EA nede: dataene fra forrige gang brukes

      - name: Hent spesialkort og lekkasjer
        run: python -m fcrating fetch-specials
        continue-on-error: true     # nettsiden nede eller blokkert: siden lages av dataene fra forrige gang

      - name: Rate og lag siden
        run: |
          files=""
          for f in data/ea_players.json data/spesialkort.json data/mine_spillere.json; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then echo "Ingen kortdata. Se loggen over for hva som feilet."; exit 1; fi
          python -m fcrating rate $files --ignorer-brukte --lagre-meta-start --top 5
          python -m fcrating publiser

      - name: Lagre startnivået for Meta (bare første gang)
        continue-on-error: true
        run: |
          if [ -f data/meta_start.json ] && [ -n "$(git status --porcelain -- data/meta_start.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/meta_start.json
            git commit -m "Meta: lagret startnivå for posisjonene"
            git push origin HEAD:main || echo "Fikk ikke lagret nå (noen andre pushet samtidig). Prøver igjen neste runde."
          fi

      - name: Lagre data til neste kjøring
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Legg ut på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
