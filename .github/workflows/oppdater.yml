# Henter nye kort, rater alt og legger siden ut på GitHub Pages.
# Oppsett: se «Legge ut siden for vennene dine» i README.md.
name: Oppdater siden

on:
  schedule:
    - cron: "25 */6 * * *"   # hver 6. time (00:25, 06:25, 12:25, 18:25 UTC). 18:25 fanger kveldens nye innhold i FUT.
  workflow_dispatch:          # knappen «Run workflow» under Actions: oppdater nå
  push:
    branches: [main]
    paths:
      - "config/**"
      - "fcrating/**"
      - "data/mine_evoer.json"
      - "data/auto_evoer.json"
      - "data/mine_spillere.json"
      - "data/side.json"
      - ".github/workflows/oppdater.yml"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TZ: Europe/Oslo             # klokkeslettet «Oppdatert ...» på sidene vises i norsk tid
  PYTHONUTF8: "1"

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # første kjøring og ukesgjennomgangen av FIFA Rosters tar lengst tid
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent data fra forrige kjøring
        uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-${{ github.run_id }}
          restore-keys: fcdata-

      - name: Hent EA-basekort (bare hvis de mangler)
        if: hashFiles('data/ea_players.json') == ''
        run: python -m fcrating fetch-ea
        continue-on-error: true

      - name: Hent spesialkort og lekkasjer
        run: python -m fcrating fetch-specials
        continue-on-error: true     # nettsiden nede eller blokkert: siden lages av dataene fra forrige gang

      - name: Rate og lag siden
        run: |
          files=""
          for f in data/ea_players.json data/spesialkort.json data/mine_spillere.json; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then echo "Ingen kortdata. Se loggen over for hva som feilet."; exit 1; fi
          python -m fcrating rate $files --ignorer-brukte --top 5
          python -m fcrating publiser

      - name: Lagre data til neste kjøring
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/ea_players.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Legg ut på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
