name: probe
on:
  push:
    branches: [claude/probe-card]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: ls -la data data/cache > /tmp/ls.txt 2>&1 || true
      - run: |
          files=""
          for f in data/ea_players.json data/spesialkort.json data/mine_spillere.json; do [ -f "$f" ] && files="$files $f"; done
          python -X faulthandler -m fcrating rate $files --ignorer-brukte --top 5 > /tmp/rate.txt 2>&1 || echo "EXIT $?" >> /tmp/rate.txt
      - if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git checkout --orphan probe-out-tmp
          git rm -rf . -q || true
          cp /tmp/ls.txt ls.txt; tail -80 /tmp/rate.txt > rate.txt
          git add -A
          git commit -q -m "probe rate"
          git push -f origin HEAD:probe-out
