name: probe
on:
  push:
    branches: [claude/probe-card]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: |
          python - > /tmp/an.txt 2>&1 <<'PY'
          from fcrating.sources import futgg
          from fcrating.specials import unique_entries
          from fcrating.sources import fifarosters as fr
          c = futgg.load_cards("data/cache/futgg")
          sp = {k: v for k, v in c.items() if v.get("kind") != "base"}
          print("futgg cards", len(c), "special", len(sp), "missing", sum(1 for v in sp.values() if v.get("missing")))
          print("special with lg", sum(1 for v in sp.values() if "lg" in v), "with face", sum(1 for v in sp.values() if v.get("face")), "with img", sum(1 for v in sp.values() if v.get("img")))
          fc = fr.FifaRostersCache("data/cache/fifarosters")
          if fc:
              todo = [fid for fid, e in unique_entries(fc) if not fr.is_base_version(e["version"])]
              print("specials total", len(todo), "not in futgg", sum(1 for f in todo if f not in c), "need refetch (no lg)", sum(1 for f in todo if f in c and "lg" not in c[f] and not c[f].get("missing")))
          PY
      - if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git checkout --orphan probe-out-tmp
          git rm -rf . -q || true
          cp /tmp/an.txt an.txt
          git add -A
          git commit -q -m "probe rate"
          git push -f origin HEAD:probe-out
