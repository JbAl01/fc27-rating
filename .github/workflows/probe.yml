name: probe
on:
  push:
    branches: [claude/probe-card]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: |
          python - > /tmp/an.txt 2>&1 <<'PY'
          import urllib.request
          UA = {"User-Agent": "fc27-rating/0.2 (personlig bruk)"}
          for pid in ("76509", "271406", "278216", "275201", "82127", "231747"):
              for g in ("FC25", "FC26", "FC27", "fc27", "FC27/full/player-portraits"):
                  path = g if "/" in g else g + "/full/player-portraits"
                  for q in ("?padding=0.7", ""):
                      u = "https://ratings-images-prod.pulse.ea.com/%s/p%s.png%s" % (path, pid, q)
                      try:
                          r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=15)
                          b = r.read(); print(pid, g, q, r.status, len(b))
                      except Exception as e:
                          print(pid, g, q, "ERR", getattr(e, "code", repr(e)[:60]))
          PY
      - if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git checkout --orphan probe-out-tmp
          git rm -rf . -q || true
          cp /tmp/an.txt an.txt
          git add -A
          git commit -q -m "probe rate"
          git push -f origin HEAD:probe-out
