# Midlertidig: undersøker datakilder og ett kort. Skriver resultatet til grenen probe-out. Slettes etterpå.
name: Probe
on:
  push:
    branches: [claude/evo-fix]
    paths: [".github/workflows/probe.yml", "ekstra/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: python ekstra/probe.py > /tmp/probe_out.txt 2>&1 || true

      - name: Lagre resultatet på grenen probe-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rfq . > /dev/null
          cp /tmp/probe_out.txt probe_out.txt
          git add probe_out.txt
          git commit -qm "probe output"
          git push -f origin probe-out
