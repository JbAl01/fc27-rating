name: probe
on:
  push:
    branches: [claude/probe-card]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: |
          python - > /tmp/an.txt 2>&1 <<'PY'
          import json, re, collections
          d = json.load(open("data/ea_players.json", encoding="utf-8"))
          ps = d["players"] if isinstance(d, dict) else d
          print("players", len(ps), "no image", sum(1 for p in ps if not p.get("image")))
          c = collections.Counter(re.sub(r"p\d+.*", "pN", p.get("image") or "NONE") for p in ps)
          for k, v in c.most_common(8): print(v, k)
          for n in ("Dermane Karim", "Jonna Brengel", "Gabriel Misehouy", "Filip Erik Thorvaldsen", "Martine Fenger"):
              m = [p for p in ps if p.get("name") == n]
              print(n, [p.get("image") for p in m][:2])
          PY
      - if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git checkout --orphan probe-out-tmp
          git rm -rf . -q || true
          cp /tmp/an.txt an.txt
          git add -A
          git commit -q -m "probe rate"
          git push -f origin HEAD:probe-out
