name: probe
on:
  push:
    branches: [claude/probe-card]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Oslo
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: |
          python - > /tmp/an.txt 2>&1 <<'PY'
          import re
          from fcrating import net
          f = net.PoliteFetcher(user_agent="fc27-rating/0.2 (personlig bruk)", delay_seconds=2)
          for key, u in {"mbappe": "https://www.fut.gg/players/231747/27-231747/", "icon": "https://www.fut.gg/players/237067/27-67345931/", "promo": "https://www.fut.gg/players/227203/27-67336067/"}.items():
              h = f.get(u)
              print("==", key, len(h))
              seen = set()
              for m in re.finditer(r'([A-Za-z]*(?:[Cc]olou?r|[Tt]ext|[Ll]ine|[Bb]ackground)[A-Za-z]*)\s*:\s*"?(#?[0-9a-fA-F]{6,8})"?', h):
                  k = (m.group(1), m.group(2))
                  if k in seen: continue
                  seen.add(k)
                  print(" ", m.group(1), m.group(2), "|", h[max(0, m.start()-120):m.start()].replace("\n", " ")[-120:])
                  if len(seen) > 40: break
              i = h.find("rarit")
              print("  rarity ctx:", h[i:i+600].replace("\n", " ") if i >= 0 else None)
          PY
      - if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git checkout --orphan probe-out-tmp
          git rm -rf . -q || true
          cp /tmp/an.txt an.txt
          git add -A
          git commit -q -m "probe rate"
          git push -f origin HEAD:probe-out
