# Midlertidig sjekk av ekte data (likhet, fødselsdato, roller). Slettes etterpå.
name: Probe
on:
  push:
    branches: [claude/probe-twin]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/ea_players.json
            data/ea_players.meta.json
            data/spesialkort.json
            data/cache
            data/evolab_cache.pkl
          key: fcdata-probe-${{ github.run_id }}
          restore-keys: fcdata-
      - run: |
          curl -sL https://jbal01.github.io/fc27-rating/evolab.html -o /tmp/evolab_live.html || true
          curl -sL https://jbal01.github.io/fc27-rating/ -o /tmp/index_live.html || true
      - run: |
          for i in 1 2 3 4; do curl -sfL https://jbal01.github.io/fc27-rating/evolab-data-$i.js -o /tmp/evolab-data-$i.js || true; done
          echo ok > /tmp/probe_out.txt
      - name: Lagre resultatet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rfq . > /dev/null
          cp /tmp/probe_out.txt probe_out.txt
          cp /tmp/futgg_page.html futgg_page.html 2>/dev/null || true
          cp /tmp/evolab_live.html /tmp/index_live.html /tmp/evolab-data-*.js . 2>/dev/null || true
          git add probe_out.txt *.html *.js
          git commit -qm "probe output"
          git push -f origin probe-out
