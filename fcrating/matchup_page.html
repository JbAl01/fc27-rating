<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchup</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1216"><script>try{if(localStorage.getItem("fcth")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
__CSS__
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin:14px 0 10px}
@media (max-width:760px){.pick{grid-template-columns:1fr}}
.side h2{font:700 20px var(--num);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.a{background:var(--link)}.dot.d{background:var(--warn)}
.side .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side input[type=search]{flex:1;min-width:0}
.hits{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);max-height:320px;overflow:auto;background:var(--surface)}
.hits:empty{display:none}
.hits li{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;justify-content:space-between}
.hits li:hover,.hits li:focus{background:var(--hl);outline:none}
.hits .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.chosen{margin-top:8px;padding:10px 12px;background:var(--surface);border-left:3px solid var(--link)}
.chosen.d{border-left-color:var(--warn)}
.chosen .nm{font-weight:700}
.chosen .sub{color:var(--muted);font-size:13px}
.chosen .tip{margin:8px 0 2px;font-size:15px}
.chosen .tip b{font-weight:700}
.evotag{color:var(--warn);font-weight:600}
.metatag{font:600 11px var(--text);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-left:4px}
details.mx>summary{cursor:pointer;color:var(--link);font-weight:600;font-size:14px;margin-top:4px;list-style:none;width:max-content}
details.mx>summary::-webkit-details-marker{display:none}
details.mx>summary::before{content:"Mer";}
details.mx[open]>summary::before{content:"Mindre"}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0 0;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center}
.res{margin:10px 0 22px;padding:16px 18px;background:var(--surface)}
.res .vw{font:700 30px/1.1 var(--num);margin:0}
.res .vy{margin:6px 0 0;color:var(--muted)}
.duels{margin-top:12px;max-width:760px}
.legend{display:flex;gap:18px;font-size:14px;margin:4px 0 10px}
.legend span{display:flex;align-items:center;gap:6px}
.du{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.du{grid-template-columns:1fr}}
.du .lb{font-size:14px}
.sp{display:flex;align-items:center;gap:8px;font:600 15px var(--num)}
.sp .v{width:38px;text-align:right}.sp .v.r{text-align:left}
.sp .v.lose{color:var(--faint);font-weight:500}
.track{flex:1;height:14px;display:flex;border-radius:3px;overflow:hidden;position:relative;background:var(--raised)}
.track i{display:block;height:100%}
.track i.a{background:var(--link)}.track i.d{background:var(--warn)}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--bg)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-top:6px}
@media (max-width:760px){.lists{grid-template-columns:1fr}}
.lists h3{font:700 17px var(--num);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.lists ol{margin:0;padding-left:22px}
.lists li{padding:4px 0;cursor:pointer}
.lists li:hover .nm{text-decoration:underline}
.lists .g{font:600 14px var(--num);margin-left:6px;color:var(--muted)}
.wk{font-size:14px}
.wk td,.wk th{padding:4px 10px 4px 0;text-align:left;border-bottom:1px solid var(--line)}
</style></head><body>
<div class="page">
<header class="top"><h1 class="sr">Matchup</h1><nav class="tabs" aria-label="Sider"><a href="rapport.html">Players</a><a href="evolab.html">Evolab</a><a href="matchup.html" class="on" aria-current="page">Matchup</a></nav>
<div class="tools"><button type="button" class="link" id="th"></button></div></header>
<div class="pick">
<section class="side" aria-labelledby="ah"><h2 id="ah"><i class="dot a"></i>Angriper</h2>
<div class="row"><input type="search" id="aq" placeholder="Navn eller versjon" aria-label="Søk etter angriper" autocomplete="off">
<select id="ap" aria-label="Posisjon"><option value="">Alle</option><option>Spiss</option><option>Kant</option><option>CAM</option></select></div>
<ul class="hits" id="ah2" role="listbox" aria-label="Angripere"></ul><div id="ac"></div></section>
<section class="side" aria-labelledby="dh"><h2 id="dh"><i class="dot d"></i>Forsvarer</h2>
<div class="row"><input type="search" id="dq" placeholder="Navn eller versjon" aria-label="Søk etter forsvarer" autocomplete="off">
<select id="dp" aria-label="Posisjon"><option value="">Alle</option><option>Midtstopper</option><option>Back</option><option>CDM</option></select></div>
<ul class="hits" id="dh2" role="listbox" aria-label="Forsvarere"></ul><div id="dc"></div></section>
</div>
<div class="opts"><label><input type="checkbox" id="evo" checked> Ta med kort etter evo (evoene som er ute nå)</label></div>
<div id="out"></div>
<footer><p class="muted" style="font-size:13px">Oppdatert __STAMP__.</p>
<p class="legal">Denne siden er ikke godkjent av eller tilknyttet EA eller deres lisensgivere. <a href="om.html">Om siden, kilder og personvern</a></p></footer>
</div>
<script>
const D=__DATA__,S=D.strings,W=D.s.w,AX=["Fart","Løpet","Nærkamp","1 mot 1","Luft"],AXA=["fart","å komme fri","nærkamp","1 mot 1","lufta"],AXD=["fart","å lese løpet","nærkamp","1 mot 1","lufta"],AXL=side=>side==="a"?AXA:AXD;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1).replace(".",","),sg=v=>(v>0?"+":"")+fmt(v);
const card=(r,i,side)=>({i,side,name:S[r[0]],ver:S[r[1]],ovr:r[2],pos:r[3],igr:r[4],acc:S[r[5]],p:r[6],uid:S[r[7]],evo:r[8]?r[8].map(x=>S[x]):null,u:r[9]||0});
const A=D.att.map((r,i)=>card(r,i,"a")),F=D.def.map((r,i)=>card(r,i,"d"));
const metaOf=list=>list.filter(c=>c.u>0).sort((x,y)=>y.u-x.u).slice(0,15);
const MA=metaOf(A),MF=metaOf(F);
let selA=null,selD=null;
function duel(a,d){const g=a.p.map((x,k)=>Math.round((x-d.p[k])*10)/10);let t=0,s=0;g.forEach((x,k)=>{t+=Math.max(-D.s.cap,Math.min(D.s.cap,x))*W[k];s+=W[k]});return{g,t:Math.round(t/s*10)/10}}
const evoOk=c=>!c.evo||$("evo").checked;
const short=n=>n.split(" ").slice(-1)[0];
const label=c=>`${esc(c.name)} <span class="muted">${esc(c.ver)}${c.evo?` <span class="evotag">etter evo</span>`:""}</span>${c.u?`<span class="metatag" title="Brukes av proffene og FUT.GG-lagene">meta</span>`:""}`;
const join=xs=>xs.length<2?xs.join(""):xs.slice(0,-1).join(", ")+" og "+xs[xs.length-1];
function search(list,q,pos){q=q.trim().toLowerCase();return list.filter(c=>evoOk(c)&&(!pos||c.pos===pos)&&(!q||(c.name+" "+c.ver).toLowerCase().includes(q))).sort((x,y)=>(y.igr||0)-(x.igr||0)).slice(0,30)}
function hits(el,list,onpick){el.innerHTML=list.map((c,k)=>`<li role="option" tabindex="0" data-k="${k}"><span>${label(c)}</span><span class="meta n">${esc(c.pos)} · ${c.ovr} · IGR ${fmt(c.igr)}</span></li>`).join("");
el.querySelectorAll("li").forEach(li=>{const go=()=>{onpick(list[+li.dataset.k]);el.innerHTML=""};li.onclick=go;li.onkeydown=e=>{if(e.key==="Enter")go()}})}
// how a card does against the most used cards on the other side, duel by duel
function vsMeta(c){const opp=(c.side==="a"?MF:MA).filter(o=>o.uid!==c.uid);if(!opp.length)return null;
const win=[0,0,0,0,0],lose=[0,0,0,0,0];let tot=0;for(const o of opp){const r=c.side==="a"?duel(c,o):duel(o,c);r.g.forEach((x,k)=>{const m=c.side==="a"?x:-x;if(m>=D.s.even)win[k]++;else if(m<=-D.s.even)lose[k]++});const t=c.side==="a"?r.t:-r.t;if(t>=D.s.even)tot++}
const n=opp.length,L=AXL(c.side),good=[0,1,2,3,4].filter(k=>win[k]>=.6*n).map(k=>L[k]),bad=[0,1,2,3,4].filter(k=>lose[k]>=.6*n).map(k=>L[k]);
return{n,win,lose,tot,good,bad}}
function tip(c){const m=vsMeta(c);if(!m)return"";
const head=c.side==="a"?(m.good.length?`Spill på ${join(m.good)}.`:"Ingen duell han vinner jevnt mot meta-forsvarerne."):(m.good.length?`Sterk i ${join(m.good)}.`:"Ingen duell han vinner jevnt mot meta-angriperne.");
const tail=m.bad.length?` ${c.side==="a"?"Unngå":"Sårbar i"} ${join(m.bad)}.`:"";
return`<p class="tip"><b>${head}</b>${tail}</p><details class="mx"><summary></summary><p class="muted" style="font-size:13px;margin:6px 0">Mot de ${m.n} mest brukte ${c.side==="a"?"forsvarerne":"angriperne"}: vinner samlet mot ${m.tot}.</p>
<table class="wk"><thead><tr><th>Duell</th><th>Vinner</th><th>Taper</th></tr></thead><tbody>${AX.map((x,k)=>`<tr><td>${k===1?(c.side==="a"?"Komme fri":"Lese løpet"):x}</td><td class="n">${m.win[k]} av ${m.n}</td><td class="n">${m.lose[k]} av ${m.n}</td></tr>`).join("")}</tbody></table></details>`}
function chosen(el,c){el.innerHTML=c?`<div class="chosen ${c.side}"><div class="nm">${label(c)}</div><div class="sub n">${esc(c.pos)} · ${c.ovr} OVR · IGR ${fmt(c.igr)}${c.acc?" · "+esc(c.acc):""}</div>${c.evo?`<div class="sub">Evoer: ${esc(c.evo.join(" › "))}</div>`:""}${tip(c)}<button type="button" class="link" data-x>Fjern</button></div>`:"";
const b=el.querySelector("[data-x]");if(b)b.onclick=()=>{if(c.side==="a")selA=null;else selD=null;draw()}}
function split(av,dv,gap){const sh=Math.max(5,Math.min(95,50+Math.max(-10,Math.min(10,gap))*4.5));const aw=gap>=D.s.even,dw=gap<=-D.s.even;
return`<div class="sp"><span class="v${dw?" lose":""}">${fmt(av)}</span><div class="track" role="img" aria-label="${fmt(av)} mot ${fmt(dv)}"><i class="a" style="width:${sh}%"></i><i class="d" style="width:${100-sh}%"></i></div><span class="v r${aw?" lose":""}">${fmt(dv)}</span></div>`}
function result(a,d){const r=duel(a,d),aw=[],dw=[];r.g.forEach((x,k)=>{if(x>=D.s.even)aw.push(AXA[k]);else if(x<=-D.s.even)dw.push(AXD[k])});
const who=Math.abs(r.t)<D.s.even?"Jevnt":(r.t>0?esc(a.name):esc(d.name))+" vinner";
const why=[aw.length?`${esc(short(a.name))} vinner ${join(aw)}.`:"",dw.length?`${esc(short(d.name))} vinner ${join(dw)}.`:""].filter(Boolean).join(" ")||"Jevnt i alle dueller.";
return`<section class="res" aria-live="polite"><p class="vw">${who}</p><p class="vy">${why}</p>
<details class="mx"><summary></summary><div class="duels"><div class="legend"><span><i class="dot a"></i>${esc(a.name)}</span><span><i class="dot d"></i>${esc(d.name)}</span></div>
${AX.map((n,k)=>`<div class="du"><div class="lb">${n}</div>${split(a.p[k],d.p[k],r.g[k])}</div>`).join("")}</div></details></section>`}
function ref(list,n){const top=list.filter(c=>!c.evo).sort((x,y)=>(y.igr||0)-(x.igr||0)).slice(0,n);return{p:[0,1,2,3,4].map(k=>{const v=top.map(c=>c.p[k]).sort((x,y)=>x-y);return v[Math.floor(v.length/2)]})}}
function ranked(me,opp,pos){const rows=opp.filter(c=>evoOk(c)&&(!pos||c.pos===pos)).map(c=>({c,t:me.side==="a"?duel(me,c).t:-duel(c,me).t}));rows.sort((x,y)=>x.t-y.t);return rows}
function li(rows){return rows.map(({c,t})=>`<li data-s="${c.side}" data-i="${c.i}"><span class="nm">${label(c)}</span><span class="g">${sg(t)}</span></li>`).join("")}
function lists(){const dot=s=>`<i class="dot ${s}"></i>`;
if(selA&&!selD){const r=ranked(selA,F,$("dp").value);return`<div class="lists"><div><h3>${dot("d")}Vanskeligst for ${esc(short(selA.name))}</h3><ol>${li(r.slice(0,12))}</ol></div><div><h3>${dot("d")}Lettest for ${esc(short(selA.name))}</h3><ol>${li(r.slice(-12).reverse())}</ol></div></div>`}
if(selD&&!selA){const r=ranked(selD,A,$("ap").value);return`<div class="lists"><div><h3>${dot("a")}Vanskeligst for ${esc(short(selD.name))}</h3><ol>${li(r.slice(0,12))}</ol></div><div><h3>${dot("a")}Lettest for ${esc(short(selD.name))}</h3><ol>${li(r.slice(-12).reverse())}</ol></div></div>`}
if(!selA&&!selD){const ra=ref(A,100),rd=ref(F,100);
const td=F.filter(c=>evoOk(c)&&(!$("dp").value||c.pos===$("dp").value)).map(c=>({c,t:-duel(ra,c).t})).sort((x,y)=>y.t-x.t).slice(0,15);
const ta=A.filter(c=>evoOk(c)&&(!$("ap").value||c.pos===$("ap").value)).map(c=>({c,t:duel(c,rd).t})).sort((x,y)=>y.t-x.t).slice(0,15);
return`<div class="lists"><div><h3>${dot("a")}Farligste angripere</h3><ol>${li(ta)}</ol></div><div><h3>${dot("d")}Tøffeste forsvarere</h3><ol>${li(td)}</ol></div></div>`}
return""}
function draw(){chosen($("ac"),selA);chosen($("dc"),selD);$("out").innerHTML=(selA&&selD?result(selA,selD):"")+lists();
$("out").querySelectorAll("li[data-s]").forEach(el=>el.onclick=()=>{const c=(el.dataset.s==="a"?A:F)[+el.dataset.i];if(c.side==="a")selA=c;else selD=c;draw();window.scrollTo({top:0,behavior:"smooth"})})}
$("aq").oninput=()=>hits($("ah2"),$("aq").value.trim()?search(A,$("aq").value,$("ap").value):[],c=>{selA=c;$("aq").value="";draw()});
$("dq").oninput=()=>hits($("dh2"),$("dq").value.trim()?search(F,$("dq").value,$("dp").value):[],c=>{selD=c;$("dq").value="";draw()});
["ap","dp","evo"].forEach(id=>$(id).onchange=draw);
draw();
</script>
<script>(function(){const t=document.getElementById("th");if(!t)return;const cur=()=>document.documentElement.getAttribute("data-theme")==="light";const lab=()=>t.textContent=cur()?"Mørk":"Lys";
t.onclick=()=>{if(cur())document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme","light");try{localStorage.setItem("fcth",cur()?"light":"dark")}catch(e){}lab()};lab()})()</script>
</body></html>
